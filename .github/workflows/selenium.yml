name: Full Selenium CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selenium-test-and-evidence:
    runs-on: ubuntu-latest

    env:
      DISPLAY: ':99'
      SELENIUM_DEMO_DELAY_MS: '1000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Maven and Java
        run: |
          mvn --version
          java -version

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Google Chrome
        run: google-chrome --version

      - name: Install Xvfb and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Verify Xvfb
        run: |
          command -v Xvfb
          echo "Xvfb is installed"

      - name: Verify ffmpeg
        run: |
          ffmpeg -version | head -n 1

      - name: Start Xvfb virtual display
        run: |
          mkdir -p artifacts

          Xvfb :99 -screen 0 1920x1080x24 \
            > artifacts/xvfb.log 2>&1 &

          echo $! > artifacts/xvfb.pid
          sleep 2

          if ! kill -0 "$(cat artifacts/xvfb.pid)" 2>/dev/null; then
            echo "Xvfb failed to start."
            cat artifacts/xvfb.log
            exit 1
          fi

          echo "Xvfb started successfully on DISPLAY=:99"

      - name: Start Selenium screen recording
        run: |
          ffmpeg -y \
            -video_size 1920x1080 \
            -framerate 12 \
            -f x11grab \
            -i :99.0 \
            -c:v libx264 \
            -preset ultrafast \
            -pix_fmt yuv420p \
            artifacts/selenium-demo.mp4 \
            > artifacts/ffmpeg.log 2>&1 &

          echo $! > artifacts/ffmpeg.pid
          sleep 2

          if ! kill -0 "$(cat artifacts/ffmpeg.pid)" 2>/dev/null; then
            echo "ffmpeg failed to start."
            cat artifacts/ffmpeg.log
            exit 1
          fi

          echo "Selenium screen recording started."

      - name: Run unit, integration, Selenium, and coverage verification
        id: maven_verify
        continue-on-error: true
        run: |
          mvn clean -Psystem-tests verify

      - name: Finalize Selenium screen recording
        if: always()
        run: |
          if [ -f artifacts/ffmpeg.pid ]; then
            FFMPEG_PID="$(cat artifacts/ffmpeg.pid)"

            if kill -0 "$FFMPEG_PID" 2>/dev/null; then
              echo "Stopping ffmpeg recording..."
              kill -INT "$FFMPEG_PID"

              for attempt in {1..20}; do
                if ! kill -0 "$FFMPEG_PID" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
            fi
          fi

          if [ ! -s artifacts/selenium-demo.mp4 ]; then
            echo "Selenium video was not created."
            echo "---- ffmpeg log ----"
            cat artifacts/ffmpeg.log || true

            echo "---- Xvfb log ----"
            cat artifacts/xvfb.log || true

            exit 1
          fi

          echo "Selenium video created successfully."
          ls -lh artifacts/selenium-demo.mp4

      - name: Upload Selenium video and display logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-video
          path: |
            artifacts/selenium-demo.mp4
            artifacts/ffmpeg.log
            artifacts/xvfb.log
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Enforce Maven verification result
        if: always()
        run: |
          if [ "${{ steps.maven_verify.outcome }}" != "success" ]; then
            echo "Maven verification failed."
            echo "The workflow will be marked as failed."
            exit 1
          fi

          echo "Maven verification passed successfully."